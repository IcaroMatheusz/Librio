
name: Publish desktop and Android releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and update metadata
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "Configure o secret VITE_SUPABASE_URL nas configurações do repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)) {
            throw "Configure o secret VITE_SUPABASE_ANON_KEY nas configurações do repositório."
          }
          npm run electron:dist -- --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Store Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/Librio-Setup-*.exe
            release/Librio-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          compression-level: 0

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate mobile code and rebuild the offline CBR reader
        working-directory: mobile
        run: |
          npm run typecheck
          npm run build:rar-reader

      - name: Generate Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          LIBRIO_VERSION: ${{ github.ref_name }}
          LIBRIO_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LIBRIO_UPLOAD_STORE_PASSWORD: ${{ secrets.LIBRIO_UPLOAD_STORE_PASSWORD }}
          LIBRIO_UPLOAD_KEY_ALIAS: librio-upload
          LIBRIO_UPLOAD_KEY_PASSWORD: ${{ secrets.LIBRIO_UPLOAD_STORE_PASSWORD }}
          LIBRIO_UPLOAD_STORE_FILE: ${{ github.workspace }}/mobile/librio-upload.jks
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$LIBRIO_UPLOAD_STORE_PASSWORD" ]; then
            echo "Configure os secrets Android de assinatura estável antes de gerar releases."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > librio-upload.jks
          node -e 'const fs=require("fs");const p="app.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.expo.version=process.env.LIBRIO_VERSION.replace(/^v/,"");c.expo.android.versionCode=Number(process.env.LIBRIO_VERSION_CODE);fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");'
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          # Release embeds the Metro bundle in the APK. Debug APKs expect a
          # running Metro server and fail on a standalone phone install.
          ./gradlew assembleRelease

      - name: Prepare signed APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk Librio-Android.apk

      - name: Store Android release file
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Librio-Android.apk
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release

      - name: Publish complete release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="Librio-Setup-$version.exe"
          files=("$installer" "$installer.blockmap" latest.yml Librio-Android.apk)
          for file in "${files[@]}"; do
            test -s "$file"
          done
          grep -Fq "path: $installer" latest.yml
          checksum="$(openssl dgst -sha512 -binary "$installer" | openssl base64 -A)"
          grep -Fq "sha512: $checksum" latest.yml

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Librio $GITHUB_REF_NAME" \
              --notes "Instaladores do Librio para Windows e Android."
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
          gh release view "$GITHUB_REF_NAME" --json url,isDraft,assets
