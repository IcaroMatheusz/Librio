
name: Publish desktop and Android releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows installer with update metadata
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "Configure o secret VITE_SUPABASE_URL nas configurações do repositório."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)) {
            throw "Configure o secret VITE_SUPABASE_ANON_KEY nas configurações do repositório."
          }
          npm run electron:dist -- --win --publish always

  android:
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          # Release embeds the Metro bundle in the APK. Debug APKs expect a
          # running Metro server and fail on a standalone phone install.
          ./gradlew assembleRelease

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Librio $GITHUB_REF_NAME" \
              --notes "Instaladores do Librio para esta versão."
          fi

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: mobile/android/app/build/outputs/apk/release/app-release.apk
          APK_NAME: Librio-Android.apk
        run: |
          test -f "$APK_PATH"
          cp "$APK_PATH" "$APK_NAME"
          gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber
